# nginx site config: /etc/nginx/sites-available/homelab (symlinked into sites-enabled)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /var/www/homelab;
    index index.html;
    server_tokens off;
    charset utf-8;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    location / {
        limit_except GET HEAD { deny all; }
        try_files $uri $uri/ =404;
    }
    # pushed hourly from pve by homelab-site-stats
    location = /stats.json {
        limit_except GET HEAD { deny all; }
        expires 5m;
    }
    location ~ /\. { deny all; }

    gzip on;
    gzip_types text/css application/javascript application/json;
    access_log /var/log/nginx/access.log;
}
